# Configuraci\u00F3n de la base de datos
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Configuraci\u00F3n JWT
application.security.jwt.secret-key=${JWT_SECRET}
application.security.jwt.expiration=${JWT_EXPIRATION}
application.security.jwt.refresh-token.expiration=${JWT_REFRESH_EXPIRATION}

# Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.show-sql=false

# Flyway: la base de produccion ya existia (creada por ddl-auto=update), se toma como version 1
# y recibe de la V2 en adelante. Antes del primer despliegue, comparar su esquema con V1__baseline.sql.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Administrador inicial (si faltan, no se crea; la contrasena debe tener al menos 12 caracteres)
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

