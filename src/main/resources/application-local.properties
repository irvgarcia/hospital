# Lee el archivo .env de la raiz del proyecto (el mismo que usa docker compose).
# Copia .env.example a .env y completa los valores; .env no se versiona.
spring.config.import=optional:file:.env[.properties]

# Configuración de la bd
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:hospitalbd}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:hospital}
spring.datasource.password=${DB_PASSWORD:hospital}

# Configuracion JWT (el secreto es obligatorio y nunca se versiona)
application.security.jwt.secret-key=${JWT_SECRET}
# Access token: 24 h. Refresh token: 7 dias
application.security.jwt.expiration=86400000
application.security.jwt.refresh-token.expiration=604800000

# Administrador inicial (si faltan, no se crea)
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# Configuración de Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.show-sql=false
spring.jpa.hibernate.ddl-auto=update

# Configuracion poneapi swagger
springdoc.swagger-ui.path=/swagger-ui-custom.html
