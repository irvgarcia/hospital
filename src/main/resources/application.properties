# Perfil activo por defecto (sobrescrito en produccion por variables de entorno)
spring.profiles.active=local

spring.jpa.open-in-view=false
# Carga en lote las colecciones LAZY (horarios de los doctores en los listados) en lugar de una consulta por fila
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# Esquema: lo crea y lo cambia Flyway (src/main/resources/db/migration); Hibernate solo comprueba
# al arrancar que las entidades coinciden con las tablas. Un cambio de entidad sin migracion impide arrancar.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.locations=classpath:db/migration
spring.jpa.properties.hibernate.format_sql=true

# Archivos (M6): 5 MB por archivo
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Documentacion de la API (springdoc). En produccion se apaga con SPRINGDOC_ENABLED=false
springdoc.api-docs.enabled=${SPRINGDOC_ENABLED:true}
springdoc.swagger-ui.enabled=${SPRINGDOC_ENABLED:true}
springdoc.swagger-ui.path=/swagger-ui.html

# CORS: origenes del frontend separados por coma (patrones). Por defecto, localhost en cualquier puerto.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:*,https://localhost:*}

# Solo el endpoint de salud del actuator
management.endpoints.web.exposure.include=health
