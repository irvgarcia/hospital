# Base de datos MySQL para desarrollo local.
# Uso: copiar .env.example a .env, ajustar valores y ejecutar `docker compose up -d`.
services:
  mysql:
    image: mysql:8.0
    container_name: hospital-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-hospitalbd}
      MYSQL_USER: ${DB_USER:-hospital}
      MYSQL_PASSWORD: ${DB_PASSWORD:-hospital}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-change-me}
    ports:
      - "${DB_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql-data:
